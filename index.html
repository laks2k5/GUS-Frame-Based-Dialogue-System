<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GUS – Multilingual Voice-First Conversational Travel Assistant</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

<div class="app-shell" id="app">

  <!-- ═══════════ Header ═══════════ -->
  <header class="app-header">
    <div class="header-left">
      <div class="brand-logo" aria-hidden="true">🤖</div>
      <div class="brand-text">
        <span class="brand-name">GUS</span>
        <span class="brand-subtitle" id="app-subtitle">Voice-First Conversational Travel Assistant</span>
      </div>
      <div class="header-status" id="header-status">
        <span class="status-dot"></span>
        <span id="status-label">🎙️ Voice & Text Ready</span>
      </div>
    </div>

    <div class="header-right">
      <!-- Multilingual Language Selector -->
      <div class="lang-selector-wrapper">
        <select id="header-lang-select" class="lang-select" title="Change Language / भाषा बदलें">
          <option value="en">🇬🇧 English</option>
          <option value="hi">🇮🇳 हिन्दी (Hindi)</option>
          <option value="bn">🇮🇳 বাংলা (Bengali)</option>
          <option value="te">🇮🇳 తెలుగు (Telugu)</option>
          <option value="ta">🇮🇳 தமிழ் (Tamil)</option>
        </select>
      </div>

      <button class="btn-voice-header" id="btn-voice-toggle" title="Toggle voice audio responses">
        <span id="voice-icon">🔊</span>
        <span id="voice-text">Voice On</span>
      </button>
      <button class="header-btn" id="btn-new-search" title="Start a new travel search">
        <span aria-hidden="true">🔍</span>
        <span class="btn-text" id="lbl-new-search">New Search</span>
      </button>
      <button class="header-btn icon-only" id="btn-help" title="Help / How GUS Works">❓</button>
      <button class="header-btn icon-only" id="btn-restart" title="Restart conversation">🔄</button>
    </div>
  </header>

  <!-- ═══════════ Slot Filling Progress Bar ═══════════ -->
  <div class="booking-progress" id="booking-progress" style="display:none" aria-label="Search progress">
    <div class="progress-info">
      <span id="progress-label">Collecting travel details…</span>
      <span id="progress-step">Step 1 of 8</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>

  <!-- ═══════════ Chat Interface ═══════════ -->
  <div class="app-content">

    <main class="chat-panel" id="chat-panel">

      <!-- Messages stream -->
      <div class="messages-area" id="messages-area"
           role="log" aria-live="polite" aria-label="Conversation">
      </div>

      <!-- Live Voice Listening Overlay (visible when mic is active) -->
      <div id="voice-listening-box" style="display:none;padding:0 1.2rem">
        <div class="voice-listening-overlay">
          <div class="vlo-header">
            <div class="vlo-title">
              <span class="vlo-dot"></span>
              <span id="vlo-listening-label">Listening… Speak naturally</span>
              <div class="sound-wave">
                <span class="sound-bar"></span>
                <span class="sound-bar"></span>
                <span class="sound-bar"></span>
                <span class="sound-bar"></span>
                <span class="sound-bar"></span>
              </div>
            </div>
            <button class="btn-sm" id="btn-stop-mic" style="background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;padding:.2rem .6rem;border-radius:6px;cursor:pointer">Done Speaking ⏹</button>
          </div>
          <div class="voice-interim-text" id="voice-interim-text"></div>
        </div>
      </div>

      <!-- Dynamic input zone (changes per slot: buttons, text input, date picker + mic button) -->
      <div class="input-zone" id="input-zone" aria-label="Input area">
      </div>

    </main>

  </div><!-- /.app-content -->

</div><!-- /.app-shell -->

<!-- ═══════════ Scripts ═══════════ -->
<script src="js/api-client.js"></script>
<script src="js/i18n.js"></script>
<script src="js/validators.js"></script>
<script src="js/frames.js"></script>
<script src="js/voice.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>

</body>
</html>
